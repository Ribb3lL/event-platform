<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Регистрация успешна — EventHub</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="container text-center">
      <div class="success-card">
        <h2>Вы успешно зарегистрированы!</h2>
        <p>
          Уважаемый(ая) <strong>{{ name }}</strong>, ваше место на мероприятие
          <strong>«{{ event }}»</strong> забронировано.
        </p>
        <p>
          Электронный билет и инструкции отправлены через сервис нотификации на
          почту: <strong>{{ email }}</strong>.
        </p>
        <br />
        <a href="/" class="btn btn-primary">Вернуться к списку мероприятий</a>
      </div>
    </main>
  </body>
</html>
