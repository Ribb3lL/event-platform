name: EventPlatform CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eventplatform-frontend:latest

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eventplatform-backend:latest

      - name: Build & Push Mailer Service
        uses: docker/build-push-action@v6
        with:
          context: ./mailer
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eventplatform-mailer:latest

      - name: Build & Push SQLite Checker
        uses: docker/build-push-action@v6
        with:
          context: ./sqlite
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eventplatform-sqlite:latest

      - name: Build & Push Proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eventplatform-proxy:latest

  test-deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          docker-compose --version

      - name: Adapt compose for CI test runner
        run: |
          sed -i "s|localhost:5000/eventplatform|${{ secrets.DOCKER_USERNAME }}/eventplatform|g" docker-compose.yaml
          sed -i "s|driver: overlay|driver: bridge|g" docker-compose.yaml

      - name: Start services
        run: |
          docker-compose up -d
          sleep 12

      - name: Verify running services
        run: |
          for s in frontend backend mailer proxy; do
            if [ -z "$(docker ps -q -f name=${s})" ]; then
              echo "Ошибка: Сервис ${s} не запущен!"
              docker-compose logs
              docker-compose down --volumes
              exit 1
            fi
          done

      - name: Test HTTP Endpoint
        run: |
          curl -f http://localhost:80 || {
            echo "Ошибка: Эндпоинт недоступен"
            docker-compose logs proxy
            docker-compose down --volumes
            exit 1
          }

      - name: Cleanup
        if: always()
        run: docker-compose down --volumes
